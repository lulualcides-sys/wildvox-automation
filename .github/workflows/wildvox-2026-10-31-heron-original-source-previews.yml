name: WildVox — heron v3 original source preview review
on:
  push:
    paths:
      - '.github/workflows/wildvox-2026-10-31-heron-original-source-previews.yml'
permissions:
  contents: write
  actions: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover original source previews from v3 render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41197246849 --repo lulualcides-sys/wildvox-automation --name wildvox-31-oct-heron-recovery --dir .
          mkdir -p qa/reviews/heron-original
          cp output/grey_heron_patient_fishing_source_*_preview.jpg qa/reviews/heron-original/
          test "$(find qa/reviews/heron-original -type f | wc -l)" -ge 8
      - name: Preserve source JPGs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/reviews/heron-original
          git commit -m 'qa: heron v3 authentic source previews for editorial review'
          git pull --rebase origin recovery/wildvox-heron-20261031
          git push origin HEAD:recovery/wildvox-heron-20261031
