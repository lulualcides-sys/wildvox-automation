name: WildVox — recover existing swan render with current per-video QA
on:
  push:
    paths:
      - '.github/workflows/wildvox-2026-10-31-swan-artifact-qa-retry.yml'
permissions:
  contents: write
  actions: read
jobs:
  qa_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve existing swan MP4 without rerender
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41197227480 --repo lulualcides-sys/wildvox-automation --name wildvox-31-oct-swan-recovery --dir .
      - name: Use merged per-candidate technical QA from main
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          git fetch origin main
          git show origin/main:scripts/qa_rendered_batch.py > scripts/qa_rendered_batch.py
          git show origin/main:scripts/tiktok_credits.py > scripts/tiktok_credits.py
          python scripts/qa_rendered_batch.py --config qa/daily-prep-candidate-2026-10-31.json --media-dir output --key mute_swan_pond_glide --report swan_technical_qa_2026-10-31.json
      - name: Archive only if QA passes; never remove editorial hold
        run: |
          set -euo pipefail
          key=mute_swan_pond_glide
          python - <<'PY'
          import json
          q=json.load(open('swan_technical_qa_2026-10-31.json'))
          assert q['technical_pass'] and not q['editorial_approved'] and q['publication_hold']
          cfg=json.load(open('qa/daily-prep-candidate-2026-10-31.json'))['mute_swan_pond_glide']
          assert q['videos'][0]['revision']==cfg['revision'], 'QA revision differs from the exact rendered source config'
          assert cfg['publication_hold'] is True, 'Editorial hold must remain active'
          print('Technically sound swan, independent visual review still required.')
          PY
          git fetch origin media
          git worktree add --force --detach /tmp/wildvox-swan-qa-media origin/media
          git -C /tmp/wildvox-swan-qa-media config user.name 'github-actions[bot]'
          git -C /tmp/wildvox-swan-qa-media config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git -C /tmp/wildvox-swan-qa-media fetch origin media
            git -C /tmp/wildvox-swan-qa-media reset --hard FETCH_HEAD
            cp "output/${key}.mp4" /tmp/wildvox-swan-qa-media/
            cp "output/${key}_meta.json" /tmp/wildvox-swan-qa-media/
            cp "output/${key}_review.jpg" /tmp/wildvox-swan-qa-media/
            cp swan_technical_qa_2026-10-31.json /tmp/wildvox-swan-qa-media/
            git -C /tmp/wildvox-swan-qa-media add -- "${key}.mp4" "${key}_meta.json" "${key}_review.jpg" swan_technical_qa_2026-10-31.json
            if git -C /tmp/wildvox-swan-qa-media diff --cached --quiet; then exit 0; fi
            git -C /tmp/wildvox-swan-qa-media commit -m 'Archive QA-verified held 31 Oct swan from existing MP4'
            if git -C /tmp/wildvox-swan-qa-media push origin HEAD:media; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Preserve QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildvox-31-oct-swan-qa-recovery
          path: swan_technical_qa_2026-10-31.json
          retention-days: 3
          if-no-files-found: warn

# 2026-10-31: exact editorial-v2 artifact 41197227480, no rerender; preserve hold.
