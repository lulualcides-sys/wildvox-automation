name: WildVox Mantis Shrimp Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wildvox-mantis-test.yml"
      - "scripts/generate_video.py"
      - "configs/mantis_shrimp_test.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg curl fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy
      - name: Render mantis shrimp test
        run: python scripts/generate_video.py --key mantis_shrimp --config configs/mantis_shrimp_test.json
      - uses: actions/upload-artifact@v4
        with:
          name: wildvox-mantis-shrimp
          path: |
            output/mantis_shrimp.mp4
            output/mantis_shrimp_meta.json
          retention-days: 1

  publish-media:
    needs: render
    runs-on: ubuntu-latest
    concurrency:
      group: wildvox-media-branch
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wildvox-mantis-shrimp
          path: public
      - name: Update persistent media branch
        run: |
          git config user.name "wildvox-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin media
          git checkout -B media origin/media
          cp public/mantis_shrimp.mp4 .
          cp public/mantis_shrimp_meta.json .
          git add mantis_shrimp.mp4 mantis_shrimp_meta.json
          git commit -m "Publish mantis shrimp test" || true
          git push origin media
