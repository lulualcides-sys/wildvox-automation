name: WildVox — research Commons hummingbird video sources
on:
  push:
    paths:
      - 'scripts/discover_commons_videos.py'
      - '.github/workflows/wildvox-source-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/discover_commons_videos.py
      - name: Persist discovery metadata on research branch only
        if: github.ref_name == 'research/wildvox-2026-10-31-footage-first-v2'
        shell: bash
        run: |
          set -euo pipefail
          cp commons-discovery.json qa/footage-first-2026-10-31.json
          git config user.name "wildvox-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa/footage-first-2026-10-31.json
          git commit -m "research: preserve source metadata for 31 Oct footage-first batch" || true
          git fetch origin research/wildvox-2026-10-31-footage-first-v2
          git rebase origin/research/wildvox-2026-10-31-footage-first-v2
          git push origin HEAD:research/wildvox-2026-10-31-footage-first-v2
      - uses: actions/upload-artifact@v4
        with:
          name: commons-hummingbird-video-discovery
          path: commons-discovery.json
          retention-days: 2
