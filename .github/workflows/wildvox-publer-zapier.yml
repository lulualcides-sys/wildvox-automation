name: WildVox Publer approved handoff

# GitHub Issue -> Zapier -> Publer. No Metricool publishing.
# Disabled until repository variable WILDVOX_PUBLER_ENABLED=true.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Optional exact approved video key (empty checks today's entries)"
        required: false
        type: string
      dry_run:
        description: "Only validate; do not create GitHub Issues"
        type: boolean
        required: true
        default: true
  schedule:
    - cron: "10 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: wildvox-publer-approved-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WILDVOX_PUBLER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      WILDVOX_PUBLER_ENABLED: ${{ vars.WILDVOX_PUBLER_ENABLED }}
    steps:
      - name: Checkout current editorial config
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout canonical media branch
        uses: actions/checkout@v4
        with:
          ref: media
          path: media-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Safety regressions
        run: |
          python -m py_compile scripts/publer_handoff.py
          python -m unittest discover -s qa -p test_publer_handoff.py -v
      - name: Ensure authorized Zapier trigger label exists
        if: ${{ vars.WILDVOX_PUBLER_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/wildvox-publer-ready" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name=wildvox-publer-ready \
              -f color=0e8a16 \
              -f description='Independently approved WildVox video ready for Publer Zap'
          fi
      - name: Hand off ONLY exact-hash, independently approved clips
        env:
          KEY_INPUT: ${{ inputs.key }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          day=$(TZ=America/Sao_Paulo date +%F)
          key_input="$KEY_INPUT"
          if [[ -n "$key_input" ]]; then
            keys=("$key_input")
          else
            mapfile -t keys < <(jq -r 'keys[]' configs/daily.json)
          fi
          if [[ "${#keys[@]}" -gt 5 ]]; then
            echo "::error::Maximum five candidates per day."
            exit 1
          fi
          for key in "${keys[@]}"; do
            revision=$(jq -r --arg key "$key" '.[$key].revision // ""' configs/daily.json)
            if [[ "$revision" != "$day"* ]]; then
              echo "::notice::Stale candidate $key skipped. No post."
              continue
            fi
            # Require today's receipt; Python later independently validates
            # the original ZIP, signatures, hashes, copy, voice and metadata.
            if ! python - "$day" "$key" <<'PY'
          import json, pathlib, sys
          day, key = sys.argv[1:]
          found = False
          for path in pathlib.Path("qa/reviews").glob("*.json"):
              try:
                  r = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if r.get("day_local") == day and r.get("candidate_key") == key and r.get("decision") == "APPROVE":
                  found = True
                  break
          sys.exit(0 if found else 1)
          PY
            then
              echo "::notice::No independent current-day APPROVE for $key."
              continue
            fi
            if [[ "$RUN_EVENT" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
              python scripts/publer_handoff.py --key "$key"
            else
              python scripts/publer_handoff.py --key "$key" --send
            fi
          done
