name: WildVox — recover existing blackbird MP4 with current per-video QA
on:
  push:
    paths:
      - '.github/workflows/wildvox-2026-10-31-blackbird-artifact-qa-retry.yml'
permissions:
  contents: write
  actions: read
jobs:
  qa_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve existing blackbird MP4 without rerender
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41196124395 --repo lulualcides-sys/wildvox-automation --name wildvox-31-oct-blackbird-recovery --dir .
      - name: Use current independent per-candidate QA from main
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          git fetch origin main
          git show origin/main:scripts/qa_rendered_batch.py > scripts/qa_rendered_batch.py
          git show origin/main:scripts/tiktok_credits.py > scripts/tiktok_credits.py
          python scripts/qa_rendered_batch.py --config qa/daily-prep-candidate-2026-10-31.json --media-dir output --key common_blackbird_park_search --report blackbird_technical_qa_2026-10-31.json
      - name: Archive ONLY if fingerprint and technical QA pass; preserve editorial hold
        run: |
          set -euo pipefail
          key=common_blackbird_park_search
          python - <<'PY'
          import json
          key='common_blackbird_park_search'
          qa=json.load(open('blackbird_technical_qa_2026-10-31.json'))
          cfg=json.load(open('qa/daily-prep-candidate-2026-10-31.json'))[key]
          assert qa['technical_pass'] and not qa['editorial_approved'] and qa['publication_hold']
          assert len(qa['videos'])==1 and qa['videos'][0]['key']==key
          assert qa['videos'][0]['revision']==cfg['revision'] and cfg['publication_hold'] is True
          print('Exact-config technical QA passed. Editorial hold remains TRUE.')
          PY
          git fetch origin media
          git worktree add --force --detach /tmp/wildvox-blackbird-qa-media origin/media
          git -C /tmp/wildvox-blackbird-qa-media config user.name 'github-actions[bot]'
          git -C /tmp/wildvox-blackbird-qa-media config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git -C /tmp/wildvox-blackbird-qa-media fetch origin media
            git -C /tmp/wildvox-blackbird-qa-media reset --hard FETCH_HEAD
            cp "output/${key}.mp4" /tmp/wildvox-blackbird-qa-media/
            cp "output/${key}_meta.json" /tmp/wildvox-blackbird-qa-media/
            cp "output/${key}_review.jpg" /tmp/wildvox-blackbird-qa-media/
            cp blackbird_technical_qa_2026-10-31.json /tmp/wildvox-blackbird-qa-media/
            git -C /tmp/wildvox-blackbird-qa-media add -- "${key}.mp4" "${key}_meta.json" "${key}_review.jpg" blackbird_technical_qa_2026-10-31.json
            if git -C /tmp/wildvox-blackbird-qa-media diff --cached --quiet; then exit 0; fi
            git -C /tmp/wildvox-blackbird-qa-media commit -m 'Archive QA-verified held 31 Oct blackbird from existing MP4'
            if git -C /tmp/wildvox-blackbird-qa-media push origin HEAD:media; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Preserve QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildvox-31-oct-blackbird-qa-recovery
          path: blackbird_technical_qa_2026-10-31.json
          retention-days: 3
          if-no-files-found: warn
