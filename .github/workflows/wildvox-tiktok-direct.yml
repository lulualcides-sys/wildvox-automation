name: WildVox TikTok Direct Test

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Canonical media key from branch media"
        required: true
        type: string
      privacy:
        description: "TikTok privacy for this explicit test publish"
        required: true
        default: "SELF_ONLY"
        type: choice
        options:
          - SELF_ONLY
          - MUTUAL_FOLLOW_FRIENDS
          - FOLLOWER_OF_CREATOR
          - PUBLIC_TO_EVERYONE
      caption_override:
        description: "Optional editable caption; blank uses metadata caption"
        required: false
        default: ""
        type: string
      consent:
        description: "I reviewed this video/caption/privacy and explicitly consent to upload it"
        required: true
        default: false
        type: boolean

jobs:
  publish:
    if: ${{ inputs.consent == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout canonical media
        uses: actions/checkout@v4
        with:
          ref: media
          path: media-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP client
        run: python -m pip install requests

      - name: Validate canonical media
        shell: bash
        run: |
          test -f "media-branch/${{ inputs.key }}.mp4"
          test -f "media-branch/${{ inputs.key }}_meta.json"
          test -f "media-branch/${{ inputs.key }}_review.jpg"

      - name: Direct post to TikTok
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_AUDITED: ${{ vars.TIKTOK_AUDITED }}
        run: |
          python scripts/tiktok_direct_post.py \
            --video "media-branch/${{ inputs.key }}.mp4" \
            --meta "media-branch/${{ inputs.key }}_meta.json" \
            --privacy "${{ inputs.privacy }}" \
            --caption-override "${{ inputs.caption_override }}" \
            --consent
