name: WildVox — preview 3 licensed heron replacements for distant source 5
on:
  push:
    paths:
      - '.github/workflows/wildvox-2026-10-31-heron-source5-targeted-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch 3 specific heron replacements and inspect actual frames
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p previews
          urls=(
            'https://commons.wikimedia.org/wiki/Special:FilePath/2022-06-04%20Grad%20Oto%C4%8Dec%20Ardea%20cinerea%20%C4%8Caplja%201.webm'
            'https://commons.wikimedia.org/wiki/Special:FilePath/2022-06-04%20Grad%20Oto%C4%8Dec%20Ardea%20cinerea%20%C4%8Caplja%202.webm'
            'https://commons.wikimedia.org/wiki/Special:FilePath/2022-10-14%20LJUBLJANA%20Krajinski%20park%20Tivoli%20CICONIIFORMES%20Ardea%20cinerea%20SIVA%20%C4%8CAPLJA.webm'
          )
          for i in 0 1 2; do
            url="${urls[$i]}"
            curl -L --fail --retry 5 --retry-delay 3 --connect-timeout 25 -A 'Mozilla/5.0' -o "previews/heron_${i}.webm" "$url"
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "previews/heron_${i}.webm")
            python - "$duration" "$i" <<'PY'
          import subprocess,sys
          d=float(sys.argv[1]);i=int(sys.argv[2])
          ts=[min(d-0.3,max(0.3,d*f)) for f in (.15,.50,.85)]
          for j,t in enumerate(ts):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(t),'-i',f'previews/heron_{i}.webm','-frames:v','1','-vf','scale=400:226:force_original_aspect_ratio=decrease,pad=400:226:(ow-iw)/2:(oh-ih)/2,format=yuv420p',f'previews/heron_{i}_{j}.jpg'],check=True)
          PY
          done
          rm -f previews/*.webm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildvox-heron-source5-replacement-previews
          path: previews/*.jpg
          retention-days: 3
