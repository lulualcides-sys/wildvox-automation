name: WildVox Buffer read-only connection check

# Read-only: lists the Buffer organisation/channels. Never creates posts.
on:
  push:
    branches: ["experimental/mpt-*"]
    paths: [".github/workflows/wildvox-buffer-check.yml"]  # rev 4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read-only Buffer check
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          WILDVOX_BUFFER_ENABLED: ${{ vars.WILDVOX_BUFFER_ENABLED }}
        run: |
          python scripts/check_buffer_connection.py
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import json, publish_buffer as pb
          orgs = pb.graphql("query { account { organizations { id } } }")["account"]["organizations"]
          for o in orgs:
              q = "query { channels(input:{organizationId:" + json.dumps(o["id"]) + "}) { name displayName externalLink service isDisconnected isLocked isQueuePaused } }"
              for c in pb.graphql(q).get("channels") or []:
                  print("CHANNEL", json.dumps(c, ensure_ascii=False))
          sys.path.insert(0, "scripts")
          import buffer_post_single as bps
          org, ch = bps.find_channel("wildvox6")
          for p in pb.read_existing_posts(org, ch):
              print("POST", p["id"], p["status"], p.get("dueAt"), p["text"][:50].replace("\n", " "))
          PY
