name: WildVox Release Vetoed Nov07 Archive
on:
  push:
    branches: [main]
    paths:
      - qa/ops/release-obsolete-v3-nov07.txt
permissions:
  actions: write
  contents: write
jobs:
  cancel-vetoed:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm five individual editorial veto records before cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for key in cat_paper_bag_to_play_nov07 sparrow_dust_bath_contrast_nov07 horse_from_shore_to_field_nov07 goat_kids_to_hillside_nov07 kingfisher_color_hidden_nov07; do
            gh api "repos/${repo}/contents/qa/reviews/2026-11-07-${key}-v3-independent-editorial-veto.json" --jq .sha > /dev/null
          done
          cancellation="requested"
          if ! gh api -X POST "repos/${repo}/actions/runs/42404858206/force-cancel"; then
            cancellation="force-request-failed"
          else
            cancellation="force-requested"
          fi
          # Independent operational receipt, separate from editorial approval.
          status=$(jq -nc --arg status "$cancellation" --arg run "${GITHUB_RUN_ID}" \
            '{cancel_request:$status,request_run_id:($run|tonumber),obsolete_vetoed_run_id:42404858206,day:"2026-11-07"}')
          sha=$(gh api "repos/${repo}/contents/wildvox-cancel-receipt.json?ref=media" --jq .sha 2>/dev/null || true)
          args=(-f "message=Record WildVox cancellation request" -f "branch=media" -f "content=$(printf %s "$status" | base64 -w0)")
          if [[ -n "$sha" ]]; then args+=(-f "sha=$sha"); fi
          gh api -X PUT "repos/${repo}/contents/wildvox-cancel-receipt.json" "${args[@]}"
          [[ "$cancellation" == "force-requested" ]]
