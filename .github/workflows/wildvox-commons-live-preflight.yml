name: WildVox — auditoria de fontes do lote em pesquisa
on:
  pull_request:
    paths:
      - "configs/daily.json"
      - "scripts/audit_commons_sources.py"
      - ".github/workflows/wildvox-commons-live-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-external-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Auditar licenças comerciais, URLs e autorias no Commons ao vivo
        run: python scripts/audit_commons_sources.py --config configs/daily.json
      - name: Validar ordenação semântica e coerência textual
        run: |
          python scripts/semantic_shots.py --check-config configs/daily.json
          python -m unittest discover -s qa -p test_narrative_contract.py -v
