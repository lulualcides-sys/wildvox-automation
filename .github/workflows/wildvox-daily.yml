name: WildVox Daily 5

on:
  push:
    branches: [main]
    # Research branches never consume render credits; only production config.
    paths:
      - "configs/daily.json"
  schedule:
    # GitHub cron is UTC. 08:30 UTC = 05:30 America/Sao_Paulo.
    - cron: "30 8 * * *"
  workflow_dispatch:

# Recovery trigger: 2026-10-24. Keep scheduled daily runs and QA gates intact.

permissions:
  contents: write
  actions: read

concurrency:
  group: wildvox-daily-5-v2
  # Preserve active renders when a second editorial batch is queued.
  # GitHub keeps at most one pending run in this concurrency group, replacing
  # obsolete pending revisions without canceling an in-progress first batch.
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      animals: ${{ steps.matrix.outputs.animals }}
      full_batch: ${{ steps.matrix.outputs.full_batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The GitHub connector cannot list push-triggered run IDs. Expose only
      # an operational receipt (never media approval) on the public media branch.
      - name: Record run ID and source config SHA for independent QA
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          day=$(TZ=America/Sao_Paulo date +%F)
          blob=$(git hash-object configs/daily.json)
          receipt=$(jq -nc \
            --arg day "$day" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg commit "${GITHUB_SHA}" \
            --arg blob "$blob" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '{day_local:$day,workflow_run_id:($run_id|tonumber),source_commit:$commit,config_blob_sha:$blob,workflow_run_url:("https://github.com/"+$repo+"/actions/runs/"+$run_id),editorial_approved:false}')
          for attempt in 1 2 3 4; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/wildvox-current-run.json?ref=media" --jq .sha 2>/dev/null || true)
            fields=(-f "message=Record WildVox workflow ${GITHUB_RUN_ID}" -f "branch=media" -f "content=$(printf %s "$receipt" | base64 -w0)")
            if [[ -n "$sha" ]]; then fields+=(-f "sha=$sha"); fi
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/wildvox-current-run.json" "${fields[@]}" >/dev/null; then
              echo "Workflow run receipt stored on media branch"
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail

          # Cron is strictly a fallback. When Daily Prep has already
          # completed a successful push run on the SAME Sao Paulo calendar
          # day, rerendering five identical videos wastes credits and can
          # overwrite the media branch. Do not limit this to two hours.
          # A failed push does NOT block cron recovery. This check executes
          # after any running push because concurrency never cancels it.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            day_start_epoch=$(TZ=America/Sao_Paulo date -d "$(TZ=America/Sao_Paulo date +%F) 00:00:00" +%s)
            successful_daily_pushes=$(curl -fsSL --retry 2 \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/wildvox-daily.yml/runs?event=push&per_page=50" \
              | jq --argjson day_start "$day_start_epoch" \
                  '[.workflow_runs[] | select(.conclusion == "success" and (.created_at | fromdateiso8601) >= $day_start)] | length')
            if [[ "$successful_daily_pushes" -gt 0 ]]; then
              echo "A successful editorial push already rendered on this local day; cron skips duplicate production."
              echo 'animals=[]' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Render exactly five daily candidates. Trend-priority entries come first;
          # remaining slots preserve the order in configs/daily.json.
          animals=$(jq -c '
            ([to_entries[] | select(.value.trend_priority == true)] +
             [to_entries[] | select(.value.trend_priority != true)])
            | map(.key)
          ' configs/daily.json)

          # A targeted editorial correction must render ONLY the changed
          # candidates. A new daily prep normally changes all five. The
          # five-entry contract is still validated against the full config.
          count=$(jq 'length' configs/daily.json)
          if [ "$count" -ne 5 ]; then
            echo "Expected exactly 5 WildVox candidates, found $count." >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" ]] && \
             git show HEAD^:configs/daily.json > /tmp/wildvox-before.json 2>/dev/null; then
            animals=$(jq -nc \
              --slurpfile before /tmp/wildvox-before.json \
              --slurpfile after configs/daily.json \
              '$after[0] | to_entries | map(select(.value != ($before[0][.key] // null))) | map(.key)')
            echo "Changed editorial candidates: $animals"
          fi
          echo "full_batch=$(jq 'length == 5' <<<"$animals")" >> "$GITHUB_OUTPUT"

          # Do not render or republish yesterday's content on today's scheduled run.
          # Revisions must identify the local editorial day for every candidate.
          editorial_day=$(TZ=America/Sao_Paulo date +%F)
          stale_keys=$(jq -r --arg day "$editorial_day" '
            to_entries[]
            | select((.value.revision // "" | startswith($day)) | not)
            | .key
          ' configs/daily.json)
          if [ -n "$stale_keys" ]; then
            echo "Fresh-content preparation required for $editorial_day; refusing stale daily.json:" >&2
            echo "$stale_keys" >&2
            exit 1
          fi

          # Reject an invalid batch before installing multi-gigabyte rendering dependencies.
          # The render script enforces these same minimums; catch them once here.
          jq -er '
            to_entries[]
            | select((.value.trend_exception.photo_only_allowed // false) == false)
            | select(
                ((.value.sources | length) < 8)
                or ((.value.sources | length) > 12)
                or ([.value.sources[] | select((.type // "video") == "video")] | length < 6)
                or ((.value.min_unique_videos // 0) < 6)
              )
            | .key
          ' configs/daily.json > /tmp/wildvox-invalid-pool.txt || true
          if [ -s /tmp/wildvox-invalid-pool.txt ]; then
            echo "Invalid daily source pools (8-12 assets, at least 6 distinct videos):" >&2
            cat /tmp/wildvox-invalid-pool.txt >&2
            exit 1
          fi

          # The renderer validates shot cadence only AFTER large ML packages
          # have been installed. Reject impossible configs here to avoid
          # wasting GitHub minutes on every matrix job.
          invalid_cadence=$(jq -r '
            to_entries[]
            | select((.value.trend_exception.photo_only_allowed // false) == false)
            | select(
                ((.value.target_shot_seconds // 0) < 6)
                or ((.value.target_shot_seconds // 0) > 8)
                or ((.value.max_shot_seconds // 0) <= 0)
                or ((.value.max_shot_seconds // 0) > 8)
                or ((.value.max_freeze_seconds // 99) < 0)
                or ((.value.max_freeze_seconds // 99) > 1)
              )
            | .key
          ' configs/daily.json)
          if [ -n "$invalid_cadence" ]; then
            echo "Invalid video shot cadence (target 6-8s, max shot <=8s, freeze <=1s):" >&2
            echo "$invalid_cadence" >&2
            exit 1
          fi

          echo "animals=$animals" >> "$GITHUB_OUTPUT"
      - name: Reject placeholder scene tags before source download or rendering
        if: steps.matrix.outputs.animals != '[]'
        run: python scripts/semantic_shots.py --check-config configs/daily.json

  render:
    needs: prepare
    if: ${{ needs.prepare.outputs.animals != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        animal: ${{ fromJson(needs.prepare.outputs.animals) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Audit each video independently: never bypass licensing; one 429 blocks only that video.
      - name: Audit only this video's Commons sources before installing dependencies
        run: |
          python -m py_compile scripts/audit_commons_sources.py
          python scripts/audit_commons_sources.py \
            --config configs/daily.json \
            --key "${{ matrix.animal }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg curl fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # spaCy 3.8.7 fails during Tokenizer._flush_specials on this runner.
          # Use the earlier official wheel compatible with en_core_web_sm 3.8.0
          # and pin preshed to avoid native-extension version drift.
          python -m pip install "kokoro==0.9.4" "spacy==3.8.4" "preshed==3.0.9" "numpy==1.26.4" soundfile
          # Fail early on TTS initialization instead of after source rendering.
          python -c "from kokoro import KPipeline; KPipeline(lang_code='a')"
      - name: Render video
        env:
          WILDVOX_SOURCE_PREVIEWS: "1"
        run: python scripts/generate_video.py --key "${{ matrix.animal }}" --config configs/daily.json
      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.animal }}
          path: |
            output/${{ matrix.animal }}.mp4
            output/${{ matrix.animal }}_meta.json
            output/${{ matrix.animal }}_review.jpg
            output/${{ matrix.animal }}_source_*_preview.jpg
          retention-days: 1

  publish-media:
    # A failed or missing fifth render must not suppress four sound candidates.
    # GitHub's render matrix runs fail-fast:false, then each artifact is checked
    # independently against the *current* five-entry config.
    needs: [prepare, render]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'failure') && needs.prepare.outputs.animals != '[]' }}
    strategy:
      fail-fast: false
      # Serial media writes avoid collisions on the shared Git branch.
      # Do NOT use job-level concurrency with a shared group here: GitHub
      # replaces older pending jobs, silently dropping other video candidates.
      max-parallel: 1
      matrix:
        animal: ${{ fromJson(needs.prepare.outputs.animals) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the artifact exists before running expensive candidate QA
        id: candidate-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="daily-${{ matrix.animal }}"
          if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[].name' | grep -Fxq "$artifact"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Render artifact missing for ${{ matrix.animal }}; skip this video's archive without wasting FFmpeg installation."
          fi
      - name: Install FFmpeg for actual candidate QA
        if: steps.candidate-artifact.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        if: steps.candidate-artifact.outputs.exists == 'true'
        with:
          name: daily-${{ matrix.animal }}
          path: public
      - name: Validate this candidate's current MP4 and metadata
        if: steps.candidate-artifact.outputs.exists == 'true'
        run: |
          python scripts/qa_rendered_batch.py \
            --config configs/daily.json \
            --media-dir public \
            --key "${{ matrix.animal }}" \
            --report "technical_qa_${{ matrix.animal }}.json"
      - name: Store technically valid candidate in root media branch
        if: steps.candidate-artifact.outputs.exists == 'true'
        run: |
          set -euo pipefail
          key="${{ matrix.animal }}"
          test -s "public/${key}.mp4"
          test -s "public/${key}_meta.json"
          test -s "public/${key}_review.jpg"

          # These are private QA candidates, NOT approved TikTok publications.
          # The editorial publication_hold remains TRUE in all metadata.
          rm -rf /tmp/wildvox-media-branch
          git fetch origin media
          git worktree add --force --detach /tmp/wildvox-media-branch origin/media
          cd /tmp/wildvox-media-branch
          git config user.name "wildvox-bot"
          git config user.email "actions@users.noreply.github.com"
          git config http.version HTTP/1.1
          # Refresh the remote tip and restage on EVERY retry. Re-pushing a
          # rejected detached commit without rebasing cannot fix a branch race.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin media
            git reset --hard FETCH_HEAD
            cp "$GITHUB_WORKSPACE/public/${key}.mp4" .
            cp "$GITHUB_WORKSPACE/public/${key}_meta.json" .
            cp "$GITHUB_WORKSPACE/public/${key}_review.jpg" .
            git add -- "${key}.mp4" "${key}_meta.json" "${key}_review.jpg"
            if git diff --cached --quiet; then
              echo "Exact candidate already archived; no duplicate commit."
              exit 0
            fi
            git commit -m "Store independently qualified WildVox candidate: ${key}"
            if git push origin HEAD:media; then
              echo "Stored ${key} as QA candidate, not editorially approved."
              exit 0
            fi
            # Another workflow may have pushed to media. Fetch/reset and
            # restage our exact files, never force-push or discard others.
            git fetch origin media
            if git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "Commit is present remotely despite ambiguous push response."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Media archive failed after six refreshed retries." >&2
          exit 1
      - name: Preserve per-candidate technical QA verdict
        if: always() && steps.candidate-artifact.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: independent-qa-${{ matrix.animal }}
          path: technical_qa_${{ matrix.animal }}.json
          if-no-files-found: warn
          retention-days: 7

  technical-qa:
    needs: [prepare, render]
    # The independent per-candidate publish-media QA covers targeted edits.
    # The aggregate QA requires all five artifacts, so run it only for a full batch.
    if: ${{ needs.render.result == 'success' && needs.prepare.outputs.full_batch == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for independent MP4 inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-*
          path: public
          merge-multiple: true
      - name: Validate all five rendered MP4s (not editorial approval)
        run: |
          python scripts/qa_rendered_batch.py \
            --config configs/daily.json \
            --media-dir public \
            --report technical_qa_report.json
      - name: Preserve technical QA report even when rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-technical-qa
          path: technical_qa_report.json
          if-no-files-found: warn
          retention-days: 7
