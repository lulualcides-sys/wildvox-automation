name: WildVox Daily 10

on:
  push:
    branches: [main]
    paths:
      - "configs/daily.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      animals: ${{ steps.matrix.outputs.animals }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          animals=$(jq -c 'keys' configs/daily.json)
          echo "animals=$animals" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    if: ${{ needs.prepare.outputs.animals != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        animal: ${{ fromJson(needs.prepare.outputs.animals) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg curl fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy
      - name: Render video
        run: python scripts/generate_video.py --key "${{ matrix.animal }}" --config configs/daily.json
      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.animal }}
          path: |
            output/${{ matrix.animal }}.mp4
            output/${{ matrix.animal }}_meta.json
            output/${{ matrix.animal }}_review.jpg
          retention-days: 1

  publish-media:
    needs: render
    if: ${{ always() && (needs.render.result == 'success' || needs.render.result == 'failure') }}
    runs-on: ubuntu-latest
    concurrency:
      group: wildvox-media-branch
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-*
          path: public
          merge-multiple: true
      - name: Publish successful daily media
        run: |
          set -euo pipefail
          rm -rf /tmp/wildvox-public /tmp/wildvox-media-branch
          mkdir -p /tmp/wildvox-public
          cp public/*.mp4 /tmp/wildvox-public/
          cp public/*_meta.json /tmp/wildvox-public/
          cp public/*_review.jpg /tmp/wildvox-public/

          git fetch origin media
          git worktree add --force --detach /tmp/wildvox-media-branch origin/media
          cp /tmp/wildvox-public/* /tmp/wildvox-media-branch/

          cd /tmp/wildvox-media-branch
          git config user.name "wildvox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- *.mp4 *_meta.json *_review.jpg

          if git diff --cached --quiet; then
            echo "No media changes to publish."
            exit 0
          fi

          git commit -m "Publish latest approved WildVox daily videos"
          git push origin HEAD:media
