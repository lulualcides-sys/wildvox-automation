name: WildVox Daily 10

on:
  push:
    branches: [main]
    paths:
      - "configs/daily.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      animals: ${{ steps.matrix.outputs.animals }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          animals=$(jq -c 'keys' configs/daily.json)
          echo "animals=$animals" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    if: ${{ needs.prepare.outputs.animals != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        animal: ${{ fromJson(needs.prepare.outputs.animals) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg curl fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy
      - name: Render video
        run: python scripts/generate_video.py --key "${{ matrix.animal }}" --config configs/daily.json
      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.animal }}
          path: |
            output/${{ matrix.animal }}.mp4
            output/${{ matrix.animal }}_meta.json
          retention-days: 1

  publish-media:
    needs: render
    if: ${{ always() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-*
          path: public
          merge-multiple: true
      - name: Publish latest daily media
        run: |
          git config user.name "wildvox-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir /tmp/wildvox-public
          cp public/*.mp4 /tmp/wildvox-public/
          cp public/*_meta.json /tmp/wildvox-public/
          git checkout --orphan media
          git rm -rf . || true
          cp /tmp/wildvox-public/* .
          git add .
          git commit -m "Publish latest WildVox daily videos"
          git push --force origin media
