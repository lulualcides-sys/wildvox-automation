name: WildVox Daily 5

on:
  push:
    paths:
      - "configs/daily.json"
      - "scripts/generate_video.py"
      - ".github/workflows/wildvox-daily.yml"
  schedule:
    # GitHub cron is UTC. 08:30 UTC = 05:30 America/Sao_Paulo.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wildvox-daily-5
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      animals: ${{ steps.matrix.outputs.animals }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail

          # Render exactly five daily candidates. Trend-priority entries come first;
          # remaining slots preserve the order in configs/daily.json.
          animals=$(jq -c '
            ([to_entries[] | select(.value.trend_priority == true)] +
             [to_entries[] | select(.value.trend_priority != true)])
            | map(.key)
          ' configs/daily.json)

          count=$(jq 'length' <<<"$animals")
          if [ "$count" -ne 5 ]; then
            echo "Expected exactly 5 WildVox candidates, found $count." >&2
            exit 1
          fi

          echo "animals=$animals" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    if: ${{ needs.prepare.outputs.animals != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        animal: ${{ fromJson(needs.prepare.outputs.animals) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg curl fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy
      - name: Render video
        run: python scripts/generate_video.py --key "${{ matrix.animal }}" --config configs/daily.json
      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.animal }}
          path: |
            output/${{ matrix.animal }}.mp4
            output/${{ matrix.animal }}_meta.json
            output/${{ matrix.animal }}_review.jpg
          retention-days: 1

  publish-media:
    needs: render
    if: ${{ always() && (needs.render.result == 'success' || needs.render.result == 'failure') }}
    runs-on: ubuntu-latest
    concurrency:
      group: wildvox-media-branch
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-*
          path: public
          merge-multiple: true
      - name: Publish successful daily media
        run: |
          set -euo pipefail
          rm -rf /tmp/wildvox-public /tmp/wildvox-media-branch
          mkdir -p /tmp/wildvox-public
          cp public/*.mp4 /tmp/wildvox-public/
          cp public/*_meta.json /tmp/wildvox-public/
          cp public/*_review.jpg /tmp/wildvox-public/

          git fetch origin media
          git worktree add --force --detach /tmp/wildvox-media-branch origin/media
          cp /tmp/wildvox-public/* /tmp/wildvox-media-branch/

          # The canonical published media location is the ROOT of the media branch.
          # Remove obsolete legacy copies so monitoring cannot reuse them.
          rm -f /tmp/wildvox-media-branch/public/frog.mp4
          rm -f /tmp/wildvox-media-branch/public/frog_meta.json
          rm -f /tmp/wildvox-media-branch/public/frog_review.jpg
          rm -f /tmp/wildvox-media-branch/public/owl.mp4
          rm -f /tmp/wildvox-media-branch/public/owl_meta.json
          rm -f /tmp/wildvox-media-branch/public/owl_review.jpg

          cd /tmp/wildvox-media-branch
          git config user.name "wildvox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No media changes to publish."
            exit 0
          fi

          git commit -m "Publish latest approved WildVox daily videos"
          git push origin HEAD:media
