name: WildVox — 31 Oct Buffer TikTok post status audit (read only)
on:
  push:
    paths:
      - '.github/workflows/wildvox-2026-10-31-buffer-readonly-capability.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Query exact ten Buffer TikTok IDs without publishing
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.publish_buffer import find_tiktok_channel, graphql, TZ
          from urllib.parse import urlparse
          ids={
            "common_blackbird_park_search":"6ae5d50beaa24d6f9a70ed23",
            "goat_herd_hillside_grazing":"6ae5d708b84259308bd45d80",
            "giraffe_reaching_for_food":"6ae5d70ca114574349a1e3da",
            "great_egret_unexpected_perch":"6ae5d710ceb491e585f46246",
            "rock_pigeon_head_bob_city_walk":"6ae5d713b84259308bd45e1f",
            "mallard_duckling_paddle_line":"6ae5d717ceb491e585f4633d",
            "eurasian_red_squirrel_stop_and_go":"6ae5d74fceb491e585f474ed",
            "grey_heron_patient_fishing":"6ae5d71b1891472093ce575a",
            "lion_cubs_learning_through_play":"6ae5d71fb84259308bd46061",
            "mute_swan_pond_glide":"6ae5d723b84259308bd460ef",
          }
          org,channel=find_tiktok_channel()
          channel_data=graphql('query { channels(input:{organizationId:'+json.dumps(org)+'}) { id name displayName service externalLink serviceId } }')['channels']
          chosen=next(x for x in channel_data if x['id']==channel)
          print('BUFFER_CHANNEL_ID='+str(chosen['id']))
          print('BUFFER_CHANNEL_NAME='+str(chosen['name']))
          print('BUFFER_CHANNEL_DISPLAY='+str(chosen['displayName']))
          print('BUFFER_CHANNEL_EXTERNAL_LINK='+str(chosen['externalLink']))
          posts=[]
          after=None
          for _ in range(8):
            after_arg='' if not after else ', after: '+json.dumps(after)
            query=('query { posts(first:50'+after_arg+', input:{ organizationId:'+json.dumps(org)+', filter:{channelIds:['+json.dumps(channel)+'],status:[scheduled,sent,error]} }) { edges { node { id text dueAt status channelId externalLink sentAt schedulingType } } pageInfo { hasNextPage endCursor } } }')
            result=graphql(query)['posts']
            posts.extend(edge['node'] for edge in result['edges'])
            page=result['pageInfo']
            if not page['hasNextPage']: break
            after=page['endCursor']
            if not after: raise RuntimeError('Buffer pagination ended without cursor')
          else: raise RuntimeError('Buffer pagination exceeded 400 posts')
          byid={p["id"]:p for p in posts}
          results=[]
          for key,postid in ids.items():
            post=byid.get(postid)
            link=(post.get("externalLink") or "") if post else ""
            parsed=urlparse(link)
            valid_link=bool(parsed.scheme=="https" and parsed.hostname in ("tiktok.com","www.tiktok.com","m.tiktok.com","vm.tiktok.com") and ("/video/" in parsed.path or parsed.hostname=="vm.tiktok.com"))
            confirmed=bool(post and post.get("status")=="sent" and post.get("sentAt") and post.get("schedulingType")=="automatic" and valid_link)
            row={"key":key,"buffer_post_id":postid,"status":post.get("status") if post else "not_returned","due_at":post.get("dueAt") if post else None,"sent_at":post.get("sentAt") if post else None,"scheduling_type":post.get("schedulingType") if post else None,"tiktok_video_url":link if valid_link else None,"channel_id_matches":post.get("channelId")==channel if post else False,"tiktok_publication_confirmed":confirmed}
            results.append(row)
            print("BUFFER_POST_STATUS "+key+" "+row["status"]+" "+str(row["due_at"])+" tiktok_link="+str(bool(row["tiktok_video_url"])))
          counts={status:sum(r["status"]==status for r in results) for status in ("scheduled","sent","error","not_returned")}
          payload={"editorial_day":"2026-10-31","checked_at_utc":datetime.now(timezone.utc).isoformat(),"checked_at_sao_paulo":datetime.now(TZ).isoformat(),"channel":"tiktok:@wildvox","buffer_channel_name":chosen['name'],"buffer_channel_external_link":chosen['externalLink'],"buffer_channel_service_id":chosen['serviceId'],"provider":"buffer","buffer_status_counts":counts,"tiktok_publication_confirmed":sum(r["tiktok_publication_confirmed"] for r in results),"note":"TikTok confirmation requires Buffer sent + sentAt + automatic + platform externalLink. TikTok analytics can lag. No posts created or modified.","posts":results}
          dest=Path("qa/reviews/2026-10-31-buffer-status-check.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(payload,indent=2)+"\n")
          print("BUFFER_STATUS_COUNTS="+json.dumps(counts))
          if any(r["status"]=="not_returned" for r in results):
            print("WARNING: one or more expected IDs not returned by Buffer status pagination")
          PY
      - name: Persist sanitized status audit only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/reviews/2026-10-31-buffer-status-check.json
          git commit -m 'audit: verify Buffer status for ten 31 Oct TikTok posts' || exit 0
          git pull --rebase origin recovery/wildvox-blackbird-20261031
          git push origin HEAD:recovery/wildvox-blackbird-20261031
