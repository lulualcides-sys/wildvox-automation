name: "WildVox — revisão Superpowers / QA"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "configs/**"
      - "qa/**"
      - ".github/workflows/wildvox-quality.yml"
  push:
    branches: [main]
    paths:
      - "qa/**"
      - ".github/workflows/wildvox-quality.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar sintaxe (sem render e sem APIs externas)
        run: |
          python -m py_compile scripts/generate_video.py scripts/tiktok_direct_post.py
      - name: Testes de regras reais de duracao, clipes e fontes
        run: python -m unittest discover -s qa -p 'test_*.py' -v
