name: WildVox — 31 Oct squirrel editorial v5 corrected source-window render
# Validated branch includes qa/validate_footage_first.py
on:
  push:
    paths:
      - '.github/workflows/wildvox-2026-10-31-squirrel-editorial-v4.yml'
permissions:
  contents: write
jobs:
  squirrel:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact 31 Oct editorial contract before costly render
        run: |
          python qa/validate_footage_first.py
          python scripts/semantic_shots.py --check-config qa/daily-prep-candidate-2026-10-31-footage-first.json
      - name: Install real render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg curl fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install 'kokoro==0.9.4' 'spacy==3.8.4' 'preshed==3.0.9' 'numpy==1.26.4' soundfile
          python -c "from kokoro import KPipeline; KPipeline(lang_code='a')"
      - name: Render independently held squirrel candidate
        env:
          WILDVOX_SOURCE_PREVIEWS: '1'
        run: |
          python scripts/generate_video.py --key eurasian_red_squirrel_stop_and_go --config qa/daily-prep-candidate-2026-10-31-footage-first.json
      - name: Technical QA for this MP4 only, never editorial approval
        run: |
          python scripts/qa_rendered_batch.py --config qa/daily-prep-candidate-2026-10-31-footage-first.json --media-dir output --key eurasian_red_squirrel_stop_and_go --report squirrel_technical_qa_2026-10-31.json
      - name: Archive independently tested candidate, still on publication hold
        run: |
          set -euo pipefail
          key=eurasian_red_squirrel_stop_and_go
          test -s "output/${key}.mp4"
          test -s "output/${key}_meta.json"
          test -s "output/${key}_review.jpg"
          git fetch origin media
          git worktree add --force --detach /tmp/wildvox-recovery-media origin/media
          git -C /tmp/wildvox-recovery-media config user.name 'github-actions[bot]'
          git -C /tmp/wildvox-recovery-media config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git -C /tmp/wildvox-recovery-media fetch origin media
            git -C /tmp/wildvox-recovery-media reset --hard FETCH_HEAD
            cp "$GITHUB_WORKSPACE/output/${key}.mp4" /tmp/wildvox-recovery-media/
            cp "$GITHUB_WORKSPACE/output/${key}_meta.json" /tmp/wildvox-recovery-media/
            cp "$GITHUB_WORKSPACE/output/${key}_review.jpg" /tmp/wildvox-recovery-media/
            cp "$GITHUB_WORKSPACE/squirrel_technical_qa_2026-10-31.json" /tmp/wildvox-recovery-media/
            git -C /tmp/wildvox-recovery-media add -- "${key}.mp4" "${key}_meta.json" "${key}_review.jpg" squirrel_technical_qa_2026-10-31.json
            if git -C /tmp/wildvox-recovery-media diff --cached --quiet; then
              echo 'Exact artifact already archived.'
              exit 0
            fi
            git -C /tmp/wildvox-recovery-media commit -m 'Archive held 31 Oct squirrel v5 with verified source window'
            if git -C /tmp/wildvox-recovery-media push origin HEAD:media; then
              echo 'Archived v5. Editorial hold remains in place.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Preserve real frames and MP4 for independent visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildvox-31-oct-squirrel-recovery
          path: |
            output/eurasian_red_squirrel_stop_and_go.mp4
            output/eurasian_red_squirrel_stop_and_go_meta.json
            output/eurasian_red_squirrel_stop_and_go_review.jpg
            output/eurasian_red_squirrel_stop_and_go_source_*_preview.jpg
            squirrel_technical_qa_2026-10-31.json
          retention-days: 3
          if-no-files-found: warn
