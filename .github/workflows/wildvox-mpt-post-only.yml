name: WildVox MPT post approved videos (no re-render)

# Triggered when configs/mpt_batch/YYYY-MM-DD.approved.json is pushed after
# visual review of the contact sheets. Reads metadata from the media branch.
on:
  push:
    branches: ["experimental/mpt-*"]
    paths: ["configs/mpt_batch/*.approved.json"]
  workflow_dispatch:
    inputs:
      date: {description: "YYYY-MM-DD", required: true}

permissions:
  contents: read

concurrency:
  group: wildvox-mpt-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s qa -p 'test_*.py'
      - id: d
        run: |
          d="${{ github.event.inputs.date }}"
          if [ -z "$d" ]; then d=$(basename "$(git diff --name-only HEAD~1 HEAD -- 'configs/mpt_batch/*.approved.json' | sort | tail -1)" .approved.json); fi
          test -f "configs/mpt_batch/$d.approved.json"
          echo "date=$d" >> "$GITHUB_OUTPUT"
      - name: Metadata from media branch
        run: |
          d=${{ steps.d.outputs.date }}
          git clone --depth 1 --filter=blob:none --no-checkout --branch media "https://github.com/${{ github.repository }}.git" media
          cd media && git sparse-checkout set --no-cone "/mpt_${d}_*_meta.json" && git checkout -q media
          mkdir -p ../metas
          for f in mpt_${d}_*_meta.json; do k=${f#mpt_${d}_}; cp "$f" "../metas/${k%_meta.json}.json"; done
          ls ../metas
      - name: Schedule approved videos on Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          d=${{ steps.d.outputs.date }}
          python scripts/buffer_post_batch.py --batch "configs/mpt_batch/$d.json" --meta-dir metas \
            --tiktok-handle wildvox --approved "configs/mpt_batch/$d.approved.json"
