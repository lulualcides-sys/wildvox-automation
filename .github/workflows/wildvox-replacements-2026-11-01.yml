name: WildVox — 1 Nov replacement footage thumbnails (NO RENDER)
on:
  push:
    branches:
      - research/wildvox-2026-11-01-footage-first
    paths:
      - "qa/research/2026-11-01-replacement-candidates.json"
      - "qa/research/2026-11-01-replacements.py"
      - ".github/workflows/wildvox-replacements-2026-11-01.yml"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - run: python qa/research/2026-11-01-replacements.py
      - name: Store candidate contact sheets on isolated research branch
        run: |
          git config user.name "wildvox-research-bot"
          git config user.email "wildvox-research-bot@users.noreply.github.com"
          git add qa/research/replacement-previews/*.b64 qa/research/replacement-previews/report.json
          git commit -m "research: replacement candidate poster contact sheets"
          git pull --rebase origin research/wildvox-2026-11-01-footage-first
          git push origin HEAD:research/wildvox-2026-11-01-footage-first
